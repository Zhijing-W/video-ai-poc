<text x="56.0" y="52.0" class="t1" text-anchor="start">最终定版 PoC（上）：视频到人物特征</text><text x="56.0" y="82.0" class="t2" text-anchor="start">第 6 部分 · 前半链路（仅左→右）　终点：轨迹级人物特征　不进入融合 / OCR / 大模型</text><text x="56.0" y="108.0" class="flow" text-anchor="start">阅读方向：全程从左到右一条主链</text><rect x="40.0" y="200" width="281.6666666666667" height="280" rx="14" fill="#DEECF9" stroke="#0078D4" stroke-width="2.2"/><text x="180.8" y="332.0" class="bt" text-anchor="middle">视频输入 / 本次参数</text><text x="180.8" y="358.0" class="bd" text-anchor="middle">样片或上传；开关仅本次生效</text><rect x="253.7" y="210.0" width="56.0" height="24" rx="12" fill="#E9F7E9" stroke="#107C10" stroke-width="1.3"/><text x="281.7" y="226.5" class="badge" text-anchor="middle" fill="#107C10">入口</text><path d="M 323.7 340.0 L 349.7 340.0" stroke="#0078D4" stroke-width="2.4" fill="none" marker-end="url(#arr)"/><rect x="351.6666666666667" y="200" width="281.6666666666667" height="280" rx="14" fill="#FFF4CE" stroke="#C19C00" stroke-width="2.2"/><text x="492.5" y="332.0" class="bt" text-anchor="middle">固定帧率抽帧</text><text x="492.5" y="358.0" class="bd" text-anchor="middle">默认约 2 fps 有序帧</text><rect x="565.3" y="210.0" width="56.0" height="24" rx="12" fill="#E9F7E9" stroke="#107C10" stroke-width="1.3"/><text x="593.3" y="226.5" class="badge" text-anchor="middle" fill="#107C10">默开</text><path d="M 635.3 340.0 L 661.3 340.0" stroke="#0078D4" stroke-width="2.4" fill="none" marker-end="url(#arr)"/><rect x="663.3333333333334" y="200" width="281.6666666666667" height="280" rx="14" fill="#E9F7E9" stroke="#107C10" stroke-width="2.2"/><text x="804.2" y="332.0" class="bt" text-anchor="middle">检测与多目标跟踪</text><text x="804.2" y="358.0" class="bd" text-anchor="middle">YOLO + ByteTrack / BoT-SORT</text><rect x="877.0" y="210.0" width="56.0" height="24" rx="12" fill="#E9F7E9" stroke="#107C10" stroke-width="1.3"/><text x="905.0" y="226.5" class="badge" text-anchor="middle" fill="#107C10">默开</text><path d="M 947.0 340.0 L 973.0 340.0" stroke="#0078D4" stroke-width="2.4" fill="none" marker-end="url(#arr)"/><rect x="975.0" y="200" width="281.6666666666667" height="280" rx="14" fill="#FFF4CE" stroke="#C19C00" stroke-width="2.2"/><text x="1115.8" y="332.0" class="bt" text-anchor="middle">切事件时间段</text><text x="1115.8" y="358.0" class="bd" text-anchor="middle">安静结束；过长截断</text><rect x="1188.7" y="210.0" width="56.0" height="24" rx="12" fill="#E9F7E9" stroke="#107C10" stroke-width="1.3"/><text x="1216.7" y="226.5" class="badge" text-anchor="middle" fill="#107C10">默开</text><path d="M 1258.7 340.0 L 1284.7 340.0" stroke="#0078D4" stroke-width="2.4" fill="none" marker-end="url(#arr)"/><rect x="1286.6666666666667" y="200" width="281.6666666666667" height="280" rx="14" fill="#F3EAF8" stroke="#5C2D91" stroke-width="2.2"/><text x="1427.5" y="332.0" class="bt" text-anchor="middle">轨迹门控与选帧</text><text x="1427.5" y="358.0" class="bd" text-anchor="middle">过短/过糊跳过；身体/脸各选最佳帧</text><rect x="1500.3" y="210.0" width="56.0" height="24" rx="12" fill="#E9F7E9" stroke="#107C10" stroke-width="1.3"/><text x="1528.3" y="226.5" class="badge" text-anchor="middle" fill="#107C10">默开</text><path d="M 1570.3 340.0 L 1596.3 340.0" stroke="#0078D4" stroke-width="2.4" fill="none" marker-end="url(#arr)"/><rect x="1598.3333333333335" y="200" width="281.6666666666667" height="280" rx="14" fill="#F3EAF8" stroke="#5C2D91" stroke-width="2.2"/><text x="1739.2" y="332.0" class="bt" text-anchor="middle">人形特征提取</text><text x="1739.2" y="358.0" class="bd" text-anchor="middle">轨迹最佳身体帧提特征</text><rect x="1812.0" y="210.0" width="56.0" height="24" rx="12" fill="#E9F7E9" stroke="#107C10" stroke-width="1.3"/><text x="1840.0" y="226.5" class="badge" text-anchor="middle" fill="#107C10">默开</text><rect x="1598.3333333333335" y="502" width="281.6666666666667" height="110" rx="12" fill="#FBF7FD" stroke="#5C2D91" stroke-width="1.8"/><text x="1739.2" y="551.0" class="bt" text-anchor="middle">人脸 / 步态（可选）</text><text x="1739.2" y="573.0" class="bs" text-anchor="middle">脸另选最佳帧；步态用序列 · 