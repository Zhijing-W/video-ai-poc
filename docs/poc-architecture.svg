<text x="740.0" y="42.0" class="title" text-anchor="middle">事件监控台 · PoC 架构（已实现能力）</text><text x="740.0" y="70.0" class="sub" text-anchor="middle">视频流 + 关注点 → 分析参数 → 抽帧/检测跟踪 → 语义事件与分窗 → 三路身份 → 关键帧与场景 → Prompt → 双助手</text><text x="740.0" y="92.0" class="hint" text-anchor="middle">绿标=默认开启　琥珀=默认关闭（可开）　场景文字在关键帧之后　对话基于本次结果追问</text><rect x="220" y="108" width="22" height="14" rx="3" fill="#DFF6DD" stroke="#107C10" stroke-width="1.4"/><text x="250.0" y="120.0" class="hint" text-anchor="start">默认开启</text><rect x="360" y="108" width="22" height="14" rx="3" fill="#FFF4CE" stroke="#C19C00" stroke-width="1.4"/><text x="390.0" y="120.0" class="hint" text-anchor="start">默认关闭（可开）</text><rect x="560" y="108" width="22" height="14" rx="3" fill="#C5F0F5" stroke="#0C8599" stroke-width="1.4"/><text x="590.0" y="120.0" class="hint" text-anchor="start">输出 / 页面</text><rect x="720" y="108" width="22" height="14" rx="3" fill="#FDE7E9" stroke="#D13438" stroke-width="1.4"/><text x="750.0" y="120.0" class="hint" text-anchor="start">大模型助手</text><rect x="900" y="108" width="22" height="14" rx="3" fill="#E8DAEF" stroke="#5C2D91" stroke-width="1.4"/><text x="930.0" y="120.0" class="hint" text-anchor="start">Prompt</text><rect class="box" x="420.0" y="145" width="640" height="78" rx="10" fill="#E8F3FC" stroke="#0078D4"/><text x="740.0" y="182.5" class="bt" text-anchor="middle">输入：视频流 + 关注点（可选）</text><text x="740.0" y="199.5" class="bd" text-anchor="middle">样片/上传视频；关注点写入后续分析提示</text><rect x="992.0" y="153.0" width="60.0" height="20" rx="6" fill="#DFF6DD" stroke="#107C10" stroke-width="1.2"/><text x="1022.0" y="167.5" class="badge" text-anchor="middle" fill="#107C10">默认开启</text><path class="arr" d="M 740.0 227.0 L 740.0 249.0"/><rect class="box" x="380.0" y="255" width="720" height="72" rx="10" fill="#E8F3FC" stroke="#0078D4"/><text x="740.0" y="298.0" class="bt" text-anchor="middle">分析参数设置（设置单次生效）</text><rect x="1043.0" y="263.0" width="49.0" height="20" rx="6" fill="#DFF6DD" stroke="#107C10" stroke-width="1.2"/><text x="1067.5" y="277.5" class="badge" text-anchor="middle" fill="#107C10">已实现</text><path class="arr" d="M 740.0 331.0 L 740.0 351.0"/><rect class="box" x="280" y="357" width="920" height="64" rx="10" fill="#FFF4CE" stroke="#F7630C"/><text x="740.0" y="396.0" class="bt" text-anchor="middle">固定帧率抽帧（默认约每秒 2 帧）</text><rect x="1132.0" y="365.0" width="60.0" height="20" rx="6" fill="#DFF6DD" stroke="#107C10" stroke-width="1.2"/><text x="1162.0" y="379.5" class="badge" text-anchor="middle" fill="#107C10">默认开启</text><path class="arr" d="M 740.0 425.0 L 740.0 443.0"/><rect class="box" x="280" y="449" width="920" height="64" rx="10" fill="#E9F7E9" stroke="#107C10"/><text x="740.0" y="488.0" class="bt" text-anchor="middle">逐帧本地 CV：YOLO 检测 + BoT-SORT+ReID / ByteTrack → 稳定 track_id</text><rect x="1132.0" y="457.0" width="60.0" height="20" rx="6" fill="#DFF6DD" stroke="#107C10" stroke-width="1.2"/><text x="1162.0" y="471.5" class="badge" text-anchor="middle" fill="#107C10">默认开启</text><path class="arr" d="M 740.0 517.0 L 740.0 535.0"/><rect class="box" x="280" y="541" width="920" height="72" rx="10" fill="#E9F7E9" stroke="#107C10"/><text x="740.0" y="575.5" class="bt" text-anchor="middle">生成语义事件信号</text><text x="740.0" y="592.5" class="bd" text-anchor="middle">新人出现 / 人离开 / 人数变化 / 新物体 / 认出熟人 → 切段与关键帧</text><rect x="1132.0" y="549.0" width="60.0" height="20" rx="6" fill="#DFF6DD" stroke="#107C10" stroke-width="1.2"/><text x="1162.0" y="563.5" class="badge" text-anchor="middle" fill="#107C10">默认开启</text><path class="arr" d="M 740.0 617.0 L 740.0 635.0"/><rect class="box" x="280" y="641" width="920" height="64" rx="10" fill="#FFF4CE" stroke="#F7630C"/><text x="740.0" y="671.5" class="bt" text-anchor="middle">切成若干「事件时间段」</text><text x="740.0" y="688.5" class="bd" text-anchor="middle">连续安静结束本段；单段过长截断</text><rect x="1132.0" y="649.0" width="60.0" height="20" rx="6" fill="#DFF6DD" stroke="#107C10" stroke-width="1.2"/><text x="1162.0" y="663.5" class="badge" text-anchor="m