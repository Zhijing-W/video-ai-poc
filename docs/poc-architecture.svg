#F7630C" stroke-width="2"/><text x="285.0" y="907.5" class="bt" text-anchor="middle">人脸质量</text><text x="285.0" y="922.5" class="bd" text-anchor="middle">角度+模糊</text><polygon points="720.0,879.0 804.0,908.0 720.0,937.0 636.0,908.0" fill="#FFF4CE" stroke="#F7630C" stroke-width="2"/><text x="720.0" y="907.5" class="bt" text-anchor="middle">相似度裁决</text><text x="720.0" y="922.5" class="bd" text-anchor="middle">余弦阈值</text><rect class="box" x="90" y="953.0" width="185" height="78" rx="10" fill="#F3EAF8" stroke="#5C2D91"/><text x="182.5" y="990.5" class="bt" text-anchor="middle">clear</text><text x="182.5" y="1007.5" class="bd" text-anchor="middle">入库 / 满权</text><rect class="box" x="290" y="953.0" width="190" height="78" rx="10" fill="#F3EAF8" stroke="#5C2D91"/><text x="385.0" y="990.5" class="bt" text-anchor="middle">marginal / poor</text><text x="385.0" y="1007.5" class="bd" text-anchor="middle">降权；只查不建</text><path class="arr" d="M 254.1 937.6 L 187.9 951.7"/><path class="arr" d="M 315.9 937.7 L 379.1 951.7"/><rect class="box" x="520" y="953.0" width="185" height="78" rx="10" fill="#F3EAF8" stroke="#5C2D91"/><text x="612.5" y="990.5" class="bt" text-anchor="middle">hit ≥0.60</text><text x="612.5" y="1007.5" class="bd" text-anchor="middle">new &lt;0.40</text><rect class="box" x="725" y="953.0" width="185" height="78" rx="10" fill="#F3EAF8" stroke="#5C2D91"/><text x="817.5" y="990.5" class="bt" text-anchor="middle">grey 灰区</text><text x="817.5" y="1007.5" class="bd" text-anchor="middle">0.40~0.60</text><path class="arr" d="M 689.1 937.6 L 617.9 951.8"/><path class="arr" d="M 750.9 937.7 L 811.2 951.6"/><rect class="box" x="290" y="1045.0" width="190" height="60" rx="10" fill="#F3EAF8" stroke="#5C2D91"/><text x="385.0" y="1073.5" class="bt" text-anchor="middle">糊脸超分(可选)</text><text x="385.0" y="1090.5" class="bd" text-anchor="middle">原图才可入库</text><path class="arr" d="M 385.0 1033.0 L 385.0 1041.0"/><rect class="box" x="725" y="1045.0" width="185" height="60" rx="10" fill="#