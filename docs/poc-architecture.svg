240" height="100" rx="10" fill="#F3EAF8" stroke="#5C2D91"/><text x="740.0" y="1329.0" class="bt" text-anchor="middle">身份置信加权 + 归一化（非简单多数票）</text><text x="740.0" y="1346.0" class="bd" text-anchor="middle">有效权重：人脸 0.5×(0.3+0.7×质量分) · 人形 0.3 · 步态 0.2（配置值不变）</text><text x="740.0" y="1363.0" class="bd" text-anchor="middle">confidence = Σ(强度×权重)/Σ权重  ← 人脸降权后，人形/步态占比自动升高；多路同一人 +0.15</text><rect x="1303.0" y="1297.0" width="49.0" height="20" rx="6" fill="#DFF6DD" stroke="#107C10" stroke-width="1.2"/><text x="1327.5" y="1311.5" class="badge" text-anchor="middle" fill="#107C10">已实现</text><path class="arr" d="M 740.0 1449.0 L 740.0 1471.0"/><rect class="box" x="280" y="1475" width="920" height="78" rx="10" fill="#FFF4CE" stroke="#F7630C"/><text x="740.0" y="1512.5" class="bt" text-anchor="middle">挑选关键帧</text><text x="740.0" y="1529.5" class="bd" text-anchor="middle">①有事件的帧优先  ②每人轨迹代表帧  ③相邻过相似去重  ④限制每段喂大模型图数</text><rect x="1132.0" y="1483.0" width="60.0" height="20" rx="6" fill="#DFF6DD" stroke="#107C10" stroke-width="1.2"/><text x="1162.0" y="1497.5" class="badge" text-anchor="middle" fill="#107C10">默认开启</text><rect class="ctn" x="80" y="1589" width="1320" height="150" rx="12" stroke="#107C10"/><rect x="98" y="1577" width="402" height="24" rx="6" fill="#fff" stroke="#107C10" stroke-width="1.4"/><text x="299.0" y="1594" class="ct" text-anchor="middle" fill="#107C10">场景信息（只在关键帧上补齐；不参与「是不是同一个人」）</text><path class="arr" d="M 740.0 1555.0 L 740.0 1585.0"/><rect class="box" x="110" y="1621" width="380" height="96" rx="10" fill="#E9F7E9" stroke="#107C10"/><text x="300.0" y="1667.5" class="bt" text-anchor="middle">场景文字 · RapidOCR</text><text x="300.0" y="1684.5" class="bd" text-anchor="middle">关键帧读字：时间戳/车牌/单号</text><rect x="422.0" y="1629.0" width="60.0" height="20" rx="6" fill="#FFF4CE" stroke="#C19C00" stroke-width="1.2"/><text x="452.0" y="1643.5" class="badge" text-anchor="middle" fill="#C19C00">默认关闭</text><rect class="box" x="550" y="1621" width="380" height="96" rx="10" fill="#E